<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="width:0;height:0;visibility:hidden;">
  <defs/>

  <!--
    Structure copied from a sprite confirmed working against this ThoughtSpot
    instance. Three things matter and are easy to get wrong:

      - viewBox is 48x48. Figma artwork must be drawn in a 48x48 frame.
      - fill="currentColor" lives on the <symbol>, once.
      - the <path> elements carry NO fill or stroke attributes, so they inherit
        it and ThoughtSpot can theme the icon like its own.

    Multiple <path> elements are fine. An earlier version embedded the source PNG
    as <image>, which is not a supported override format: a raster ignores fill,
    so it cannot be coloured and does not behave like an icon.

    Replace the placeholder below with the paths exported from Figma.
  -->

  <symbol id="rd-icon-spotter" viewBox="0 0 48 48" fill="currentColor">

    <!-- PLACEHOLDER — delete these two and paste the Figma paths here. -->
    <path d="M24 4a20 20 0 1 0 0 40 20 20 0 0 1 0-40z" opacity="0.25"/>
    <path d="M14 34V18l10 8V14l10 8v12z"/>

  </symbol>
</svg>
